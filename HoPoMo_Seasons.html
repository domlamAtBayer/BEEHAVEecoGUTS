<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BEEHAVE — Season Reporter</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e2e;
      color: #f8f8f2;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #cba6f7;
      letter-spacing: 0.04em;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 18px;
    }
    .main {
      display: flex;
      flex-direction: row;
      gap: 28px;
      width: 100%;
      max-width: 1100px;
      align-items: stretch;
      min-height: 560px;
    }
    /* ── Slider panel ── */
    .panel {
      background: #2a2a3e;
      border: 1px solid #44475a;
      border-radius: 10px;
      padding: 20px 18px;
      min-width: 240px;
      max-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .panel h2 {
      font-size: 1rem;
      color: #8be9fd;
      border-bottom: 1px solid #44475a;
      padding-bottom: 8px;
      margin-bottom: 2px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-label {
      font-size: 0.82rem;
      color: #ccc;
      font-weight: 600;
    }
    .slider-desc {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 2px;
    }
    .slider-val {
      font-size: 0.82rem;
      color: #f1fa8c;
      font-weight: bold;
      min-width: 34px;
      text-align: right;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #44475a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #bd93f9;
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #bd93f9;
      border: none;
      cursor: pointer;
    }
    /* ── Reset button ── */
    button#resetBtn {
      margin-top: 6px;
      background: #ff5555;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px 0;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button#resetBtn:hover { background: #ff7777; }
    /* ── Formulae ── */
    .formula-box {
      background: #181825;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.78rem;
      color: #a0a0c0;
      line-height: 1.7;
    }
    .formula-box span { color: #50fa7b; font-style: italic; }
    /* ── Plot ── */
    #plot {
      flex: 1;
      min-width: 0;
      height: 560px;
      min-height: 560px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #44475a;
    }
  </style>
</head>
<body>
  <h1>🐝 BEEHAVE — Season Reporter (HoPoMo)</h1>
  <p class="subtitle">Adjust parameters to explore the seasonal brood cycle curve.</p>

  <div class="main">
    <!-- ── Sliders ── -->
    <div class="panel">
      <h2>Parameters</h2>

      <div class="slider-group">
        <div class="slider-desc">Amplitude 1</div>
        <div class="slider-row">
          <span class="slider-label">x1</span>
          <span class="slider-val" id="v_x1">385</span>
        </div>
        <input type="range" id="x1" min="10" max="1000" step="1" value="385"
               oninput="document.getElementById('v_x1').textContent=this.value; updatePlot()">
      </div>

      <div class="slider-group">
        <div class="slider-desc">Spread 1</div>
        <div class="slider-row">
          <span class="slider-label">x2</span>
          <span class="slider-val" id="v_x2">25</span>
        </div>
        <input type="range" id="x2" min="1" max="100" step="1" value="25"
               oninput="document.getElementById('v_x2').textContent=this.value; updatePlot()">
      </div>

      <div class="slider-group">
        <div class="slider-desc">Amplitude 2</div>
        <div class="slider-row">
          <span class="slider-label">x3</span>
          <span class="slider-val" id="v_x3">36</span>
        </div>
        <input type="range" id="x3" min="1" max="200" step="1" value="36"
               oninput="document.getElementById('v_x3').textContent=this.value; updatePlot()">
      </div>

      <div class="slider-group">
        <div class="slider-desc">Peak day</div>
        <div class="slider-row">
          <span class="slider-label">x4</span>
          <span class="slider-val" id="v_x4">155</span>
        </div>
        <input type="range" id="x4" min="1" max="365" step="1" value="155"
               oninput="document.getElementById('v_x4').textContent=this.value; updatePlot()">
      </div>

      <div class="slider-group">
        <div class="slider-desc">Spread 2</div>
        <div class="slider-row">
          <span class="slider-label">x5</span>
          <span class="slider-val" id="v_x5">30</span>
        </div>
        <input type="range" id="x5" min="1" max="100" step="1" value="30"
               oninput="document.getElementById('v_x5').textContent=this.value; updatePlot()">
      </div>

      <button id="resetBtn" onclick="resetDefaults()">⟳ Reset to defaults</button>

      <div class="formula-box">
        <span>seas₁</span> = 1 − 1/(1 + x1·e^(−2t/x2))<br>
        <span>seas₂</span> = 1/(1 + x3·e^(−2(t−x4)/x5))<br>
        <span>Season</span> = 1 − max(seas₁, seas₂)
      </div>
    </div>

    <!-- ── Plot ── -->
    <div id="plot"></div>
  </div>

const MONTHS = {
  ticks: [0,31,59,90,120,151,181,212,243,273,304,334],
  labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};

const DEFAULTS = {x1:385, x2:25, x3:36, x4:155, x5:30};

function computeCurves(x1, x2, x3, x4, x5) {
  const seas1 = t.map(d => 1.0 - 1.0 / (1.0 + x1 * Math.exp(-2.0 * d / x2)));
  const seas2 = t.map(d => 1.0 / (1.0 + x3 * Math.exp(-2.0 * (d - x4) / x5)));
  const sinv  = t.map((_, i) => 1.0 - Math.max(seas1[i], seas2[i]));
  const inv1  = seas1.map(v => 1 - v);
  const inv2  = seas2.map(v => 1 - v);
  return { inv1, inv2, sinv };
}

function makePlot() {
  const {x1,x2,x3,x4,x5} = getVals();
  const {inv1, inv2, sinv} = computeCurves(x1,x2,x3,x4,x5);

  const traces = [
    {
      x: t, y: inv1, mode:"lines", name:"1 − seas₁",
      line:{color:"#50fa7b", width:2, dash:"dash"}, opacity:0.75
    },
    {
      x: t, y: inv2, mode:"lines", name:"1 − seas₂",
      line:{color:"#ffb86c", width:2, dash:"dash"}, opacity:0.75
    },
    {
      x: t, y: sinv, mode:"lines", name:"Season (inverted)",
      line:{color:"#8be9fd", width:3},
      fill:"tozeroy", fillcolor:"rgba(139,233,253,0.10)"
    }
  ];

  const layout = {
    paper_bgcolor:"#2a2a3e",
    plot_bgcolor:"#2a2a3e",
    font:{color:"#f8f8f2"},
    margin:{t:40, r:20, b:60, l:60},
    xaxis:{
      title:"Day of Year",
      tickvals: MONTHS.ticks,
      ticktext: MONTHS.labels,
      range:[0,365],
      gridcolor:"#44475a",
      color:"#f8f8f2"
    },
    yaxis:{
      title:"Season Parameter (inverted)",
      range:[-0.02, 1.08],
      gridcolor:"#44475a",
      color:"#f8f8f2"
    },
    legend:{
      bgcolor:"#1e1e2e",
      bordercolor:"#555577",
      borderwidth:1
    },
    title:{text:"Season Reporter Output", font:{size:14, color:"#cba6f7"}}
  };

  Plotly.newPlot("plot", traces, layout, {responsive:true});
}

function updatePlot() {
  const {x1,x2,x3,x4,x5} = getVals();
  const {inv1, inv2, sinv} = computeCurves(x1,x2,x3,x4,x5);
  Plotly.restyle("plot", {y:[inv1, inv2, sinv]}, [0,1,2]);
}

function getVals() {
  return {
    x1: parseFloat(document.getElementById("x1").value),
    x2: parseFloat(document.getElementById("x2").value),
    x3: parseFloat(document.getElementById("x3").value),
    x4: parseFloat(document.getElementById("x4").value),
    x5: parseFloat(document.getElementById("x5").value)
  };
}

function resetDefaults() {
  for (const [key, val] of Object.entries(DEFAULTS)) {
    document.getElementById(key).value = val;
    document.getElementById("v_" + key).textContent = val;
  }
  updatePlot();
}

makePlot();
